name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Fix activation-history regression and verify full suite
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/fix-activation-history.py
          node tests/activation-history-regression.test.js
          node tests/academic-year-calendar.test.js
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git add Code.gs tests/activation-history-regression.test.js
          git commit -m "fix: snapshot continuing classes on year activation"
          git push origin HEAD:feature/academic-year-calendar-archive-tdd