name: Add admin attendance statistics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-admin-statistics.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm RED before implementation
        shell: bash
        run: |
          if node .github/tmp/test-statistics.js; then
            echo 'Statistics test unexpectedly passed before implementation.'
            exit 1
          else
            echo 'RED confirmed: admin statistics model is not implemented yet.'
          fi

      - name: Implement statistics
        shell: bash
        run: python .github/tmp/add-statistics.py

      - name: Verify GREEN
        shell: bash
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node .github/tmp/test-statistics.js
          grep -q "Statistika" Code.gs
          grep -q "stats:submitted" Code.gs
          grep -q "stats:missing" Code.gs
          grep -q "stats:absent" Code.gs
          grep -q "stats:classrow" Code.gs
          grep -q "function doPost" Code.gs

      - name: Remove temporary files
        shell: bash
        run: rm -rf .github/tmp .github/workflows/add-admin-statistics.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add admin attendance statistics"
          git push
