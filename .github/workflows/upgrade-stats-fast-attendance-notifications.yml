name: Upgrade statistics fast attendance and notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-stats-fast-attendance-notifications.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm RED
        run: |
          if node tools/test_upgrade.js; then
            echo "Test unexpectedly passed before implementation."
            exit 1
          else
            echo "RED confirmed."
          fi
      - name: Implement
        run: python tools/upgrade_once.py
      - name: Verify GREEN
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node tools/test_upgrade.js
      - name: Remove temporary files
        run: rm -rf tools .github/workflows/upgrade-stats-fast-attendance-notifications.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add range stats fast attendance and reminders"
          git push
