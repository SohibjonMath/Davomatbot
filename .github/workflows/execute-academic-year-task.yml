name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Task 7 red green
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if node tests/academic-year-calendar.test.js calendar-ui; then exit 1; else echo RED_OK; fi
          python tools/apply-academic-year-upgrade.py 7
          python tools/repair-task7.py
          node tests/academic-year-calendar.test.js calendar-ui
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git add Code.gs
          git commit -m "feat: add school calendar admin controls"
          git push origin HEAD:feature/academic-year-calendar-archive-tdd