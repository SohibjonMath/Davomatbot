name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Confirm review regressions RED
        run: |
          set -e
          if node tests/review-regressions.test.js; then
            echo 'Review regression test unexpectedly passed before fixes'
            exit 1
          else
            echo 'RED_OK: review regressions reproduced'
          fi