name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Task 8 red green and full suite
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if node tests/academic-year-calendar.test.js triggers; then exit 1; else echo RED_OK; fi
          python tools/apply-academic-year-upgrade.py 8
          node tests/academic-year-calendar.test.js triggers
          node tests/academic-year-calendar.test.js
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node -e "const x=require('./appsscript.json'); if(x.timeZone!=='Asia/Tashkent') process.exit(1)"
          git add Code.gs
          git commit -m "test: verify multi year attendance lifecycle"
          git push origin HEAD:feature/academic-year-calendar-archive-tdd