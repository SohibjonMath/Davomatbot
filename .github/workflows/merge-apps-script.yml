name: Merge Apps Script into one file

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-apps-script.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify current multi-file state
        shell: bash
        run: |
          set -euo pipefail
          count=$(find . -maxdepth 1 -type f -name '*.gs' | wc -l | tr -d ' ')
          if [ "$count" -le 1 ]; then
            echo "Expected multi-file state before merge, found $count .gs file(s)."
            exit 1
          fi
          echo "RED confirmed: repository still has $count Apps Script source files; target is one Code.gs."

      - name: Merge Apps Script sources
        shell: bash
        run: |
          set -euo pipefail
          files=(Config.gs Sheets.gs State.gs Auth.gs Classes.gs Students.gs Users.gs Attendance.gs Telegram.gs Ui.gs Setup.gs Code.gs)
          : > Code.merged.gs
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing required source: $f"
              exit 1
            fi
            printf '\n// ===== %s =====\n\n' "$f" >> Code.merged.gs
            cat "$f" >> Code.merged.gs
            printf '\n' >> Code.merged.gs
          done
          mv Code.merged.gs Code.gs
          rm -f Attendance.gs Auth.gs Classes.gs Config.gs Setup.gs Sheets.gs State.gs Students.gs Telegram.gs Ui.gs Users.gs

      - name: Verify merged script
        shell: bash
        run: |
          set -euo pipefail
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          test -f appsscript.json
          test "$(find . -maxdepth 1 -type f -name '*.gs' | wc -l | tr -d ' ')" = "1"
          test -f Code.gs
          grep -q 'function doPost' Code.gs
          grep -q 'function claimClass_' Code.gs
          grep -q 'function releaseOwnClass_' Code.gs
          grep -q 'function setupDavomatOne' Code.gs
          grep -q 'function installTelegramWebhook' Code.gs
          echo "GREEN: syntax valid and only Code.gs remains."

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/merge-apps-script.yml

      - name: Commit merged layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge Apps Script into single Code.gs"
          git push
