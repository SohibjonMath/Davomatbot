name: Fix Telegram webhook 302

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-telegram-302.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm failing webhook response pattern
        shell: bash
        run: |
          set -euo pipefail
          block=$(grep -A3 -F 'function safeOutput_()' Code.gs)
          echo "$block"
          if echo "$block" | grep -q 'HtmlService.createHtmlOutput'; then
            echo 'Expected RED state, but redirect-safe response is already present.'
            exit 1
          fi
          echo "$block" | grep -q 'ContentService.createTextOutput'
          echo 'RED confirmed: safeOutput_ still uses ContentService, which redirects.'

      - name: Replace redirecting ContentService response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Code.gs')
          text = p.read_text()
          old = "function safeOutput_() {\n  return ContentService.createTextOutput(JSON.stringify({ ok:true })).setMimeType(ContentService.MimeType.JSON);\n}"
          new = "function safeOutput_() {\n  return HtmlService.createHtmlOutput('OK');\n}"
          if old not in text:
              raise SystemExit('Expected safeOutput_ implementation not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Verify fix
        shell: bash
        run: |
          set -euo pipefail
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          block=$(grep -A3 -F 'function safeOutput_()' Code.gs)
          echo "$block"
          echo "$block" | grep -q "HtmlService.createHtmlOutput('OK')"
          if echo "$block" | grep -q 'ContentService'; then
            echo 'ContentService still present in safeOutput_.'
            exit 1
          fi
          grep -q 'function doPost' Code.gs
          grep -q 'function claimClass_' Code.gs
          grep -q 'function releaseOwnClass_' Code.gs
          echo 'GREEN: webhook response no longer uses ContentService redirect.'

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/fix-telegram-302.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Telegram webhook 302 redirect"
          git push
