name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Confirm activation-history regression RED
        run: |
          set -e
          if node tests/activation-history-regression.test.js; then
            echo 'Regression test unexpectedly passed before fix'
            exit 1
          else
            echo 'RED_OK: continuing class lacks new-year snapshot before fix'
          fi