<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002050">
<title>Davomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/sections.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="top">
  <div><h1 id="pageTitle">Davomat</h1><small id="pageSubtitle">Namangan 1-IMI</small></div>
  <span id="academicTag" class="tag">2026–2027</span>
</header>
<div id="loader" class="loader" aria-hidden="true"></div>
<main class="layout">
  <div id="errorNotice" class="notice error hidden" role="alert"></div>
  <section id="app" class="hidden">
    <div class="card">
      <div class="heading">
        <div><strong id="attendanceTitle">Bugungi davomat</strong><div class="muted small" id="selectedDate">—</div></div>
        <button id="switchHistory" type="button" class="btn ghost"><i class="fa-solid fa-clock-rotate-left"></i> Ötgan sanalar</button>
      </div>
      <label class="field" for="classSelect">Sinf</label>
      <select id="classSelect"></select>
      <div id="todayNotice" class="notice hidden"></div>
      <div id="todayStatus" class="todayStatus"></div>
    </div>
    <section id="historyPanel" class="card hidden">
      <div class="heading">
        <strong>Sanalar</strong>
        <div class="monthControls">
          <button class="btn square" id="prevMonth" aria-label="Oldingi oy"><i class="fa-solid fa-chevron-left"></i></button>
          <strong id="monthTitle">—</strong>
          <button class="btn square" id="nextMonth" aria-label="Keyingi oy"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="legend"><span class="legendDone">Berilgan</span><span class="legendMissing">Berilmagan</span><span class="legendPartial">Chala</span><span class="legendOff">Dam / ta’til</span></div>
      <div class="calendarHead"><span>Du</span><span>Se</span><span>Ço</span><span>Pa</span><span>Ju</span><span>Şa</span><span>Ya</span></div>
      <div id="calendar" class="calendar"></div>
      <div class="switchline">
        <label class="checkrow"><input id="multi" type="checkbox"> Bir neçta sana</label>
        <button id="clearDates" class="btn" type="button">Tozalaş</button>
      </div>
      <p class="muted small" id="dateHelp">Davomat sanasini tanlang.</p>
    </section>
    <section class="card">
      <div class="heading"><strong>Öquvçilar</strong><span id="count" class="pill">0 ta</span></div>
      <div id="summary" class="summary"></div>
      <div id="emptyRoster" class="notice">Öquvçilar yüklanmoqda…</div>
      <div id="rosterArea" class="hidden">
        <input id="search" type="search" placeholder="Ism yoki familiyani qidiriş" aria-label="Öquvçi qidiriş">
        <div class="switchline">
          <span class="small muted" id="currentSelection">—</span>
          <button id="allPresent" type="button" class="btn ghost">Hammasi keldi</button>
        </div>
        <div id="students"></div>
      </div>
    </section>
  </section>
  <section id="sectionPanel" class="sectionPanel hidden" aria-label="Bölim"></section>
</main>
<footer id="sticky" class="sticky hidden">
  <div class="stickyInner">
    <div id="status" class="status" aria-live="polite">Yüklanmoqda…</div>
    <button id="save" type="button" class="btn primary" disabled><i class="fa-solid fa-floppy-disk"></i> Saqlash</button>
  </div>
</footer>
<dialog id="confirmDialog" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">Davomatni tasdiqlaş</h2>
  <p id="dialogText"></p>
  <div class="dialogActions"><button class="btn" id="cancelConfirm" type="button">Bekor qilish</button><button class="btn secondary" id="acceptConfirm" type="button">Tasdiqlash</button></div>
</dialog>
<dialog id="sectionDialog" class="sectionModal" aria-labelledby="sectionDialogTitle">
  <h3 id="sectionDialogTitle">Özgartirish</h3>
  <form id="sectionForm" class="sectionForm"></form>
  <div id="sectionDialogError" class="sectionMessage error" aria-live="polite"></div>
  <div class="modalActions"><button type="button" id="sectionCancel" class="sectionButton">Bekor qilish</button><button type="submit" form="sectionForm" id="sectionSubmit" class="sectionButton accent">Saqlash</button></div>
</dialog>
<script src="/sections.js"></script>
<script src="/app.js"></script>
</body>
</html>
