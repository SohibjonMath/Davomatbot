name: Execute academic year task
on:
  push:
    branches: [feature/academic-year-calendar-archive-tdd]
    paths: ['.github/workflows/execute-academic-year-task.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academic-year-calendar-archive-tdd
          fetch-depth: 0
      - name: Fix review regressions and verify all suites
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/fix-review-regressions.py
          node tests/review-regressions.test.js
          node tests/activation-history-regression.test.js
          node tests/academic-year-calendar.test.js
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node -e "const x=require('./appsscript.json'); if(x.timeZone!=='Asia/Tashkent') process.exit(1)"
          git add Code.gs tests/review-regressions.test.js
          git commit -m "fix: harden multi year attendance lifecycle"
          git push origin HEAD:feature/academic-year-calendar-archive-tdd