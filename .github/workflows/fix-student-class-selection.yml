name: Fix student class selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-student-class-selection.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write regression test
        shell: bash
        run: |
          cat > /tmp/test-selection.js <<'EOF'
          const fs = require('fs');
          const code = fs.readFileSync('Code.gs', 'utf8');
          const required = [
            "function getClassBySheetRow_(rowNumber)",
            "callback_data:'stu:classrow:' + row._row",
            "p[0] === 'stu' && p[1] === 'classrow'",
            "showStudentsForClass_(chatId, actor, classIdKey_(classRow.class_id))"
          ];
          for (const needle of required) {
            if (!code.includes(needle)) {
              console.error('Missing:', needle);
              process.exit(1);
            }
          }
          console.log('Student class selection uses exact sheet row identity.');
          EOF

      - name: Confirm RED before fix
        shell: bash
        run: |
          if node /tmp/test-selection.js; then
            echo 'Regression test unexpectedly passed before fix.'
            exit 1
          else
            echo 'RED confirmed: old student class selector does not use exact row identity.'
          fi

      - name: Patch Code.gs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Code.gs')
          s = p.read_text()
          old = """function showStudentsClassChoice_(chatId) {
            sendMessage_(chatId, 'Sinfni tanlang.', classChoiceKeyboard_('stu:class', false));
          }
          """
          new = """function getClassBySheetRow_(rowNumber) {
            const row = Number(rowNumber);
            const sheet = getSheet_(SHEETS.CLASSES);
            if (!Number.isInteger(row) || row < 2 || row > sheet.getLastRow()) throw new Error('Sinf topilmadi.');
            const headers = getHeaders_(SHEETS.CLASSES);
            const values = sheet.getRange(row, 1, 1, headers.length).getValues()[0];
            const obj = { _row: row };
            headers.forEach((header, index) => obj[header] = values[index]);
            if (!(obj.active === true || String(obj.active).toLowerCase() === 'true')) throw new Error('Sinf topilmadi.');
            return obj;
          }

          function showStudentsClassChoice_(chatId) {
            const rows = listActiveClasses_().map(row => [{
              text: String(row.class_name),
              callback_data:'stu:classrow:' + row._row
            }]);
            sendMessage_(chatId, 'Sinfni tanlang.', buildInlineKeyboard_(rows));
          }
          """
          if old not in s:
            raise SystemExit('showStudentsClassChoice_ block not found')
          s = s.replace(old, new, 1)
          old_branch = """    } else if (p[0] === 'stu' && p[1] === 'class') {
              showStudentsForClass_(chatId, actor, p[2]);
          """
          new_branch = """    } else if (p[0] === 'stu' && p[1] === 'classrow') {
              const classRow = getClassBySheetRow_(p[2]);
              showStudentsForClass_(chatId, actor, classIdKey_(classRow.class_id));
            } else if (p[0] === 'stu' && p[1] === 'class') {
              showStudentsForClass_(chatId, actor, p[2]);
          """
          if old_branch not in s:
            raise SystemExit('student callback branch not found')
          s = s.replace(old_branch, new_branch, 1)
          p.write_text(s)
          PY

      - name: Verify GREEN
        shell: bash
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node /tmp/test-selection.js
          grep -q "function doPost" Code.gs
          grep -q "function addStudentsBulk_" Code.gs

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/fix-student-class-selection.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix student class selection routing"
          git push
